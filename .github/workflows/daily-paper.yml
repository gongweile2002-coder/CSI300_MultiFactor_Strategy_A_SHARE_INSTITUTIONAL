name: Daily A-share paper trading

on:
  workflow_dispatch:
  schedule:
    # 19:30 Asia/Shanghai, Monday-Friday. China Standard Time is UTC+8 year-round.
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-ashare-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Tushare secret
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::Repository secret TUSHARE_TOKEN is required."
            exit 1
          fi
      - name: Restore live-data cache
        uses: actions/cache@v4
        with:
          path: data/live
          key: live-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            live-data-${{ runner.os }}-
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Refresh real data, generate candidates and update paper book
        run: python daily_paper.py run --refresh --initial-cash 500000
      - name: Upload auditable run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-run-${{ github.run_id }}
          path: |
            outputs/v8_signal
            paper/live/runs
            paper/live/nav_history.csv
            paper/live/order_history.csv
            paper/live/fill_history.csv
          if-no-files-found: error
          retention-days: 90
      - name: Commit paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/live
          if git diff --cached --quiet; then
            echo "No paper-state changes."
          else
            git commit -m "paper: update daily paper ledger"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
